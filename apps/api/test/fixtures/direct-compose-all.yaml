# Frozen multi-service policy fixture; commands are illustrative, not a health claim.
name: dic-22222222-2222-4222-8222-222222222222
services:
  web:
    image: node:22.23.4-bookworm-slim
    init: true
    restart: "no"
    networks: [stack]
    cap_drop: [NET_RAW]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
    labels:
      docker-image-creator.managed: runtime
      docker-image-creator.user: 11111111-1111-4111-8111-111111111111
      docker-image-creator.config: 22222222-2222-4222-8222-222222222222
      docker-image-creator.revision: 33333333-3333-4333-8333-333333333333
      docker-image-creator.policy: "2"
    environment:
      APP_PASSWORD: ${DIC_SECRET_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb:?Required value}
    command:
      [
        node,
        -e,
        "require('node:http').createServer((_q,r)=>r.end('ok')).listen(8000,'0.0.0.0')",
      ]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    ports:
      [{ target: 8000, published: "18080", host_ip: 127.0.0.1, protocol: tcp }]
    depends_on:
      db: { condition: service_healthy }
      py: { condition: service_healthy }
  py:
    image: python:3.13.18-slim-bookworm
    init: true
    restart: "no"
    networks: [stack]
    cap_drop: [NET_RAW]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
    labels:
      docker-image-creator.managed: runtime
      docker-image-creator.user: 11111111-1111-4111-8111-111111111111
      docker-image-creator.config: 22222222-2222-4222-8222-222222222222
      docker-image-creator.revision: 33333333-3333-4333-8333-333333333333
      docker-image-creator.policy: "2"
    command: [python, -m, http.server, "8000", --bind, 0.0.0.0]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000',timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
  db:
    image: mysql:8.4.11
    init: true
    restart: "no"
    networks: [stack]
    cap_drop: [NET_RAW]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
    labels:
      docker-image-creator.managed: runtime
      docker-image-creator.user: 11111111-1111-4111-8111-111111111111
      docker-image-creator.config: 22222222-2222-4222-8222-222222222222
      docker-image-creator.revision: 33333333-3333-4333-8333-333333333333
      docker-image-creator.policy: "2"
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_ROOT_PASSWORD: ${DIC_SECRET_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:?Required value}
      MYSQL_PASSWORD: ${DIC_SECRET_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb:?Required value}
    volumes:
      [
        {
          type: volume,
          source: db-data,
          target: /var/lib/mysql,
          read_only: false,
        },
      ]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --no-defaults --protocol=TCP -h 127.0.0.1 -u app app -e "SELECT 1"',
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
  mongo:
    image: mongo:8.0.17
    init: true
    restart: "no"
    networks: [stack]
    cap_drop: [NET_RAW]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
    labels:
      docker-image-creator.managed: runtime
      docker-image-creator.user: 11111111-1111-4111-8111-111111111111
      docker-image-creator.config: 22222222-2222-4222-8222-222222222222
      docker-image-creator.revision: 33333333-3333-4333-8333-333333333333
      docker-image-creator.policy: "2"
    environment:
      MONGO_INITDB_DATABASE: app
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: ${DIC_SECRET_cccccccccccccccccccccccccccccccc:?Required value}
    volumes:
      - { type: volume, source: mongo-data, target: /data/db, read_only: false }
      - {
          type: volume,
          source: mongo-configdb,
          target: /data/configdb,
          read_only: false,
        }
    healthcheck:
      test:
        [
          CMD,
          mongosh,
          --quiet,
          --eval,
          'quit(db.getSiblingDB("admin").auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD)?0:1)',
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
networks:
  stack:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.gateway_mode_ipv4: isolated }
    labels:
      docker-image-creator.managed: runtime
      docker-image-creator.user: 11111111-1111-4111-8111-111111111111
      docker-image-creator.config: 22222222-2222-4222-8222-222222222222
      docker-image-creator.policy: "2"
volumes:
  db-data:
    labels:
      docker-image-creator.managed: runtime
      docker-image-creator.user: 11111111-1111-4111-8111-111111111111
      docker-image-creator.config: 22222222-2222-4222-8222-222222222222
      docker-image-creator.policy: "2"
  mongo-data:
    labels:
      docker-image-creator.managed: runtime
      docker-image-creator.user: 11111111-1111-4111-8111-111111111111
      docker-image-creator.config: 22222222-2222-4222-8222-222222222222
      docker-image-creator.policy: "2"
  mongo-configdb:
    labels:
      docker-image-creator.managed: runtime
      docker-image-creator.user: 11111111-1111-4111-8111-111111111111
      docker-image-creator.config: 22222222-2222-4222-8222-222222222222
      docker-image-creator.policy: "2"
