# Apply filesystem restrictions to new Codex sessions in this repository.
# Legacy sandbox_mode settings or --sandbox override permission profiles.
default_permissions = "project-env-protected"

  [mcp_servers.phpstorm]
    url = "http://127.0.0.1:64442/stream"


[permissions.project-env-protected]
extends = ":workspace"

[permissions.project-env-protected.filesystem]
# Linux expands recursive deny globs before each sandboxed process starts.
glob_scan_max_depth = 32

[permissions.project-env-protected.filesystem.":workspace_roots"]
".env" = "deny"
"**/.env" = "deny"
"**/*.env" = "deny"
"**/.env.*" = "deny"
