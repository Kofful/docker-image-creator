# From the repository root, load interpolation variables from the root .env:
# docker compose --env-file .env -f infra/docker-compose.yml up --build -d --wait
services:
  web:
    image: docker-image-creator-web:local
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - infrastructure
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: docker-image-creator-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with URL-encoded MySQL credentials}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?Set AUTH_ACCESS_TOKEN_SECRET to at least 32 random bytes}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://127.0.0.1:8080}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?Set CONFIG_ENCRYPTION_KEY to 32 random bytes encoded as 64 hexadecimal characters (openssl rand -hex 32)}
      CONFIG_ARTIFACT_ROOT: /app/.runtime/configs
      CONFIG_FAKE_DELAY_MS: ${CONFIG_FAKE_DELAY_MS:-0}
      TERMINAL_RUNNER_URL: ws://runner:3001/terminal
    volumes:
      - generated-configs:/app/.runtime/configs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - infrastructure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  runner:
    image: docker-image-creator-runner:local
    build:
      context: ..
      dockerfile: apps/runner/Dockerfile
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with URL-encoded MySQL credentials}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?Set CONFIG_ENCRYPTION_KEY}
      CONFIG_ARTIFACT_ROOT: /app/.runtime/configs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - generated-configs:/app/.runtime/configs
    depends_on:
      api:
        condition: service_healthy
    networks:
      - infrastructure

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-docker_image_creator}
      MYSQL_USER: ${MYSQL_USER:-docker_image_creator}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - infrastructure
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  infrastructure:
    driver: bridge

volumes:
  mysql-data:
  generated-configs:
